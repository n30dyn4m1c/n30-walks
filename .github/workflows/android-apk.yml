# Builds an installable Android APK on every push. Every build is uploaded as a
# workflow artifact; only builds of the default branch are published as the
# "apk-latest" pre-release, so it can be downloaded straight to a phone.
#
# Signing: if the repo secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD
# are set, the APK is signed with that key, so each new build installs over the
# previous one and keeps your walks. ANDROID_KEY_ALIAS (default "stride") and
# ANDROID_KEY_PASSWORD (default: the keystore password) are optional.
# Without them, Gradle's throwaway debug key is used: fine for a first test, but
# every build then has a different key and Android makes you uninstall first.
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write # needed only by the publish step, which runs on the default branch

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships the Android SDK (ANDROID_HOME, licenses accepted);
      # Gradle downloads any missing platform/build-tools itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app and generate the Android project
        run: node scripts/mobile.mjs android --no-open

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stride.keystore"
            echo "STRIDE_KEYSTORE=$RUNNER_TEMP/stride.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            echo "::warning::No signing secrets set; using a throwaway debug key. Updates will need an uninstall first."
          fi

      - name: Build APK
        working-directory: android
        env:
          STRIDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STRIDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'stride' }}
          STRIDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION_CODE=${{ github.run_number }}
          ARGS="-PversionCode=$VERSION_CODE"
          if [ -n "$STRIDE_KEYSTORE" ]; then
            # Sign the debug build with the stable key instead of the random one.
            cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  stride {
                      storeFile file(System.getenv('STRIDE_KEYSTORE'))
                      storePassword System.getenv('STRIDE_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('STRIDE_KEY_ALIAS')
                      keyPassword System.getenv('STRIDE_KEY_PASSWORD')
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.stride } }
          }
          EOF
          fi
          # Monotonic versionCode so Android always accepts the new build as an update.
          cat >> app/build.gradle <<'EOF'

          android.defaultConfig.versionCode = (project.findProperty('versionCode') ?: '1') as int
          android.defaultConfig.versionName = "0.1.${android.defaultConfig.versionCode}"
          EOF
          ./gradlew assembleDebug $ARGS --no-daemon --stacktrace
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/Stride.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stride-apk
          path: ${{ runner.temp }}/out/Stride.apk

      - name: Publish as "apk-latest" pre-release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$RUNNER_TEMP/out/Stride.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Stride APK (latest build)" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7} (run #${{ github.run_number }}). Open this page on your phone and tap **Stride.apk** to download and install."
